<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дерево клиентов</title>
<style>
  body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; max-width: 1050px; margin: 0 auto; }
  .top { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  input, button { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
  button.primary { background: #38bdf8; color: #0f172a; font-weight: bold; border: none; }
  .node { margin-bottom: 8px; }
  .head { background: #1e293b; border: 1px solid #334155; padding: 12px 14px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .head:hover { border-color: #38bdf8; }
  .kids { margin-left: 20px; padding-left: 14px; border-left: 2px dashed #334155; margin-top: 6px; display: none; }
  .kids.open { display: block; }
  .card { background: #162032; border: 1px solid #334155; border-radius: 8px; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .item { background: #1e293b; padding: 10px 12px; border-radius: 6px; font-size: 14px; line-height: 1.45; }
  .item b { display: block; color: #38bdf8; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
  .modal.show { display: flex; }
  .box { background: #1e293b; padding: 20px; border-radius: 10px; width: 90%; max-width: 650px; }
  textarea { width: 100%; height: 240px; background: #0f172a; color: #a5f3fc; border: 1px solid #334155; margin: 10px 0; padding: 8px; }
</style>
</head>
<body>
<div class="top">
  <h2 style="margin:0; margin-right:auto;">🌳 Дерево клиентов</h2>
  <input id="q" placeholder="Поиск по ФИО, компании, фактам..." oninput="render(this.value)">
  <button onclick="allOpen(true)">Развернуть всё</button>
  <button onclick="allOpen(false)">Свернуть всё</button>
  <button class="primary" onclick="openM()">+ Загрузить JSON</button>
</div>
<div id="root"></div>

<div class="modal" id="m">
  <div class="box">
    <b>Вставь JSON от нейросети:</b>
    <textarea id="jin"></textarea>
    <button onclick="document.getElementById('m').classList.remove('show')">Отмена</button>
    <button class="primary" onclick="save()">Сохранить и построить</button>
  </div>
</div>

<script>
const def = [
  {
    "role": "ЛПР — Безопасники/ИТ",
    "companies": [
      {
        "company": "Ромашка (крупный ритейл)",
        "people": [
          {
            "fio": "Валерий Викторович Строганов",
            "position": "ИТ-директор (CIO)",
            "factors": [
              {
                "n": 1,
                "name": "Моральная составляющая",
                "text": "Консерватор. Скептически относится к модным трендам и ИИ. Не любит, когда ему «продают», ценит факты и сухие цифры. Общается жестко, может резко оборвать, если ему кажется, что менеджер не разбирается в технике."
              },
              {
                "n": 2,
                "name": "Кошелёк (Бюджет)",
                "text": "Предпочитает крупные, долгосрочные проекты. Бюджет выделяет неохотно, любит растягивать оплату по этапам. Часто берет «бюджетные» пилоты, чтобы проверить подрядчика."
              },
              {
                "n": 3,
                "name": "История взаимодействия",
                "text": "С нами работал 2 года назад, проект сдали с трудом (были баги). Сейчас взаимодействуем редко, мы предлагаем идеи и активно используем пиар-компанию, от него - нет ответа, игнор, переписка сугубо официальная."
              },
              {
                "n": 4,
                "name": "История посещений",
                "text": "Игнорирует массовые вебинары и конференции. Один раз посетил закрытый ужин для CIO. На мероприятия ходит только ради нетворкинга с топами, а не ради контента."
              },
              {
                "n": 5,
                "name": "Лояльность к нам",
                "text": "Низкая. Открыто доверяет нашему конкуренту (компании N). Любит докапываться до мелких недочетов в КП, часто вносит правки в договор."
              },
              {
                "n": 6,
                "name": "Вовлеченность в процесс",
                "text": "Высокая, но токсичная. Требует детального ТЗ на 50 листов. Не дает доступ к инфраструктуре, пока не подпишет NDA. Данные выдает скупо."
              },
              {
                "n": 7,
                "name": "Степень понимания",
                "text": "Очень высоко шарит в ИТ и безопасности. Понимает, чего хочет, но его требования иногда избыточны. Если мы предложим что-то некомпетентное — сразу это заметит."
              },
              {
                "n": 8,
                "name": "Дедлайны",
                "text": "Жесткие. Если сказал «внедрить до 1 декабря», то опоздание даже на день — повод для штрафов и разрыва контракта."
              },
              {
                "n": 9,
                "name": "Точка входа / Рычаг влияния",
                "text": "На него невозможно выйти напрямую через маркетинг. Лучший способ — зайти через его финансового директора (показать ROI) или через лояльного нам технического специалиста из его команды."
              }
            ]
          }
        ]
      }
    ]
  },
  {
    "role": "ЛДПР — Закупки материалов",
    "companies": [
      {
        "company": "Вектор-Строй (девелопмент и строительство)",
        "people": [
          {
            "fio": "Елена Сергеевна Ковалёва",
            "position": "Руководитель отдела закупок и снабжения",
            "factors": [
              {
                "n": 1,
                "name": "Моральная составляющая",
                "text": "Прагматик и перестраховщик. Главная цель — закрыть заявку вовремя и без проблем для себя. Не любит сложные технические термины, ей важна простота, надежность и понятные условия. Общается вежливо, но сухо и по делу, ценит свое время."
              },
              {
                "n": 2,
                "name": "Кошелёк (Бюджет)",
                "text": "Работает строго в рамках утвержденной сметы. Ищет минимальную цену на рынке и всегда просит скидку (минимум 10–15%). Обожает постоплату или отсрочку платежа на 30–60 дней."
              },
              {
                "n": 3,
                "name": "История взаимодействия",
                "text": "Новая компания, ранее не работали. Попала в нашу базу после холодного обзвона. На письма отвечает медленно, часто пересылает их своим подчиненным с пометкой «разобраться и доложить»."
              },
              {
                "n": 4,
                "name": "История посещений",
                "text": "Никуда не ходит, так как завалена рутиной и тендерами. Иногда смотрит короткие обзорные ролики по выбору поставщиков или читает отраслевые телеграм-каналы про логистику и цены на сырье."
              },
              {
                "n": 5,
                "name": "Лояльность к нам",
                "text": "Нейтрально-настороженная. У нее уже есть 2–3 «прикормленных» проверенных поставщика, с которыми она работает годами. Менять их ради нас она не хочет, чтобы не рисковать срывом поставок."
              },
              {
                "n": 6,
                "name": "Вовлеченность в процесс",
                "text": "Средняя, бюрократическая. Ей не интересны детали продукта, ее волнуют сертификаты, сроки отгрузки, наличие товара на складе и правильность закрывающих документов (УПД, счета-фактуры)."
              },
              {
                "n": 7,
                "name": "Степень понимания",
                "text": "Отлично разбирается в ценообразовании, логистике и тендерных процедурах. В технических характеристиках материалов разбирается поверхностно — ориентируется только на те параметры, которые ей спустили инженеры в заявке."
              },
              {
                "n": 8,
                "name": "Дедлайны",
                "text": "«Нужно было еще вчера». Заявки от строителей часто прилетают в последний момент, поэтому ей критически важна скорость выставления счета и быстрая доставка."
              },
              {
                "n": 9,
                "name": "Точка входа / Рычаг влияния",
                "text": "Прямые продажи «в лоб» не работают. Зайти можно через статус «запасного аэродрома» (когда основной поставщик подведет по срокам или цене), либо через главного инженера объекта, который сам укажет в заявке конкретно нашу марку материалов."
              }
            ]
          }
        ]
      }
    ]
  },
  {
    "role": "ЛВР — Юристы",
    "companies": [
      {
        "company": "Вектор-Строй (девелопмент и строительство)",
        "people": [
          {
            "fio": "Артём Олегович Светлов",
            "position": "Ведущий юрисконсульт",
            "factors": [
              {
                "n": 1,
                "name": "Моральная составляющая",
                "text": "Доброжелательный, открытый и легкий в общении человек. Старается не создавать конфликтов и всегда идет навстречу, если его вежливо попросить. Не любит бюрократические войны и искренне хочет, чтобы сделка прошла быстро и безболезненно для всех сторон."
              },
              {
                "n": 2,
                "name": "Кошелёк (Бюджет)",
                "text": "Сам бюджетом не распоряжается и в цифры особо не вникает. Смотрит только на то, чтобы в договоре не было очевидных кабальных штрафов для его компании, а общая сумма сходилась с заявкой."
              },
              {
                "n": 3,
                "name": "История взаимодействия",
                "text": "Работали с ним пару раз по мелким договорам. Всегда на связи в мессенджерах, отвечает быстро, с юмором и смайликами. Если в документах есть мелкие ошибки, не заворачивает их официально, а просто пишет в личку: «Поправьте вот тут по-братски, и я подпишу»."
              },
              {
                "n": 4,
                "name": "История посещений",
                "text": "Любит любые активности, где можно отвлечься от рутины. С удовольствием ходит на наши открытые вебинары, бизнес-завтраки и неформальные встречи, даже если тема не совсем юридическая — просто ради приятной атмосферы и общения."
              },
              {
                "n": 5,
                "name": "Лояльность к нам",
                "text": "Максимально высокая. Считает нас «своими ребятами» и надежными партнерами. Полностью доверяет нашим формулировкам в договоре и часто подписывает документы почти не глядя, полагаясь на наше честное слово."
              },
              {
                "n": 6,
                "name": "Вовлеченность в процесс",
                "text": "Низкая, формальная. Ему лень глубоко погружаться в суть проекта. Если мы сами подготовим шаблон договора, спецификацию и все приложения, он с радостью согласует их за полчаса, чтобы не делать лишнюю работу самому."
              },
              {
                "n": 7,
                "name": "Степень понимания",
                "text": "В стройке, материалах и технических деталях вообще не разбирается. Легко верит на слово нашим менеджерам, когда мы объясняем, зачем нужен тот или иной пункт в ТЗ или спецификации."
              },
              {
                "n": 8,
                "name": "Дедлайны",
                "text": "Очень гибкие и лояльные. Никогда не давит по срокам. Если мы не успеваем прислать документы или закрывающие акты вовремя, легко согласует перенос дат задним числом или подпишет допсоглашение без лишних вопросов."
              },
              {
                "n": 9,
                "name": "Точка входа / Рычаг влияния",
                "text": "Прямой контакт в мессенджере. Через него можно легко «протащить» выгодные для нас правки в договоре, обойти жесткие требования отдела закупок или заранее узнать, на каком этапе согласования застряли наши документы внутри компании."
              }
            ]
          }
        ]
      }
    ]
  }
]
;

let data = JSON.parse(localStorage.getItem('treeDataV2')) || def;

function render(f = '') {
  const r = document.getElementById('root'); r.innerHTML = '';
  const q = f.toLowerCase().trim();
  const grp = {};

  data.forEach(rObj => {
    const role = rObj.role;
    (rObj.companies || []).forEach(cObj => {
      const comp = cObj.company;
      (cObj.people || []).forEach(p => {
        if (q && !JSON.stringify({ role, comp, p }).toLowerCase().includes(q)) return;
        grp[role] = grp[role] || {};
        grp[role][comp] = grp[role][comp] || [];
        grp[role][comp].push(p);
      });
    });
  });

  for (const [role, comps] of Object.entries(grp)) {
    let html = `<div class="node"><div class="head" onclick="this.nextElementSibling.classList.toggle('open')"><b>▶ ${role}</b><span style="color:#94a3b8;font-size:13px">Компаний: ${Object.keys(comps).length}</span></div><div class="kids ${q?'open':''}">`;
    for (const [comp, ppl] of Object.entries(comps)) {
      html += `<div class="node"><div class="head" onclick="this.nextElementSibling.classList.toggle('open')"><b>▶ 🏢 ${comp}</b><span style="color:#94a3b8;font-size:13px">Людей: ${ppl.length}</span></div><div class="kids ${q?'open':''}">`;
      ppl.forEach(p => {
        const fs = (p.factors || []).map(item => `<div class="item"><b>${item.n ? item.n + '. ' : ''}${item.name}</b>${item.text}</div>`).join('');
        html += `<div class="node"><div class="head" onclick="this.nextElementSibling.classList.toggle('open')"><b>▶ 👤 ${p.fio} (${p.position})</b><span style="color:#94a3b8;font-size:13px">Открыть досье</span></div><div class="kids ${q?'open':''}"><div class="card">${fs}</div></div></div>`;
      });
      html += `</div></div>`;
    }
    html += `</div></div>`;
    r.innerHTML += html;
  }
}

function allOpen(v) { document.querySelectorAll('.kids').forEach(e => e.classList.toggle('open', v)); }
function openM() { document.getElementById('jin').value = JSON.stringify(data, null, 2); document.getElementById('m').classList.add('show'); }
function save() {
  try {
    data = JSON.parse(document.getElementById('jin').value);
    localStorage.setItem('treeDataV2', JSON.stringify(data));
    render(); document.getElementById('m').classList.remove('show');
  } catch(e) { alert('Ошибка JSON: ' + e.message); }
}
render();
</script>
</body>
</html>
