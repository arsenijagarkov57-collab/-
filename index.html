<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База клиентов — дерево</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937;background:#f8fafc;display:flex;flex-direction:column;overflow:hidden}

/* Панель инструментов */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(15,23,42,.06);z-index:5}
.toolbar h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
.toolbar .stat{font-size:12px;color:#64748b;white-space:nowrap}
.spacer{flex:1 1 auto}
.field{position:relative;display:flex;align-items:center}
.field input{width:250px;max-width:42vw;padding:8px 12px 8px 30px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:#f8fafc;color:#0f172a;outline:none}
.field input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.18)}
.field .ico{position:absolute;left:9px;font-size:13px;opacity:.55;pointer-events:none}
button{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
button:hover{border-color:#94a3b8;background:#f1f5f9}
button.primary{background:#38bdf8;border-color:#0ea5e9;color:#04263a;font-weight:600}
button.primary:hover{background:#22a9e0}
button.active{background:#dcfce7;border-color:#22c55e;color:#14532d;font-weight:600}
.zoom{display:flex;align-items:center;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden}
.zoom button{border:none;border-radius:0;padding:8px 10px}
.zoom .pc{min-width:54px;text-align:center;font-size:12px;color:#475569;background:#f8fafc;padding:8px 4px;border-left:1px solid #e2e8f0;border-right:1px solid #e2e8f0;cursor:pointer}

/* Рабочая область — холст со светлой сеткой */
.viewport{position:relative;flex:1 1 auto;overflow:auto;background-color:#f8fafc;background-image:linear-gradient(#e9eef5 1px,transparent 1px),linear-gradient(90deg,#e9eef5 1px,transparent 1px);background-size:26px 26px;background-position:-1px -1px}
.zoomwrap{position:relative}
.canvas{position:absolute;top:0;left:0;transform-origin:top left}
.edges{position:absolute;top:0;left:0;overflow:visible;z-index:0}
.edges path{fill:none;stroke:#475569;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.nodes{position:absolute;top:0;left:0;z-index:1}

/* Карточки-узлы */
.card{position:absolute;border-radius:12px;border:2px solid #cbd5e1;background:#fff;box-shadow:0 2px 6px rgba(15,23,42,.10);padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;overflow:hidden;user-select:none;transition:box-shadow .15s,transform .15s}
.card .ttl{font-size:14px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.card .sub{font-size:11.5px;line-height:1.25;color:#475569;overflow-wrap:anywhere}
.card .fc{color:#9d174d;font-weight:600;white-space:nowrap}
.card .caret{position:absolute;top:4px;right:7px;font-size:11px;opacity:.7}
.card .badge{position:absolute;bottom:5px;right:8px;font-size:10.5px;background:rgba(15,23,42,.08);color:#334155;padding:1px 7px;border-radius:999px}
.t-root{background:#fef9c3;border-color:#f59e0b}
.t-root .ttl{font-size:15px}
.t-role{background:#dcfce7;border-color:#22c55e}
.t-company{background:#dbeafe;border-color:#3b82f6}
.t-person{background:#fce7f3;border-color:#ec4899}
.t-factor{background:#ede9fe;border-color:#8b5cf6;border-width:1.5px}
.t-factor .ttl{font-size:12.5px;font-weight:600}
.card[data-act]{cursor:pointer}
.card[data-act]:hover{box-shadow:0 6px 16px rgba(15,23,42,.20);transform:translateY(-2px)}
.t-person:hover{border-color:#db2777}
.t-factor:hover{border-color:#7c3aed}
.card.collapsed{filter:saturate(.8)}
.card.hit{box-shadow:0 0 0 3px rgba(56,189,248,.6),0 4px 12px rgba(15,23,42,.15)}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
/* Панель подробностей клиента */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
.overlay[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(15,23,42,.22);z-index:50;transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer .dhead{padding:16px 18px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.drawer .dhead .nm{font-size:16px;font-weight:700;padding-right:36px}
.drawer .dhead .ps{font-size:12.5px;color:#475569;margin-top:3px}
.drawer .chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid transparent;font-weight:600}
.chip.role{background:#dcfce7;border-color:#22c55e;color:#14532d}
.chip.company{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}
.drawer .dbody{padding:14px 18px;overflow:auto;flex:1}
.fitem{border:1px solid #e2e8f0;border-left:4px solid #8b5cf6;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fcfbff}
.fitem .fn{font-size:12.5px;font-weight:700;color:#5b21b6;margin-bottom:5px}
.fitem .ft{font-size:13px;line-height:1.5;color:#334155}
.fitem.flash{background:#fef9c3;border-left-color:#f59e0b}
.dclose{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:15px;line-height:1;cursor:pointer}

/* Модальное окно JSON */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:760px;box-shadow:0 20px 50px rgba(15,23,42,.35);display:flex;flex-direction:column;max-height:90vh}
.mbox b{font-size:15px}
.mbox .hint{font-size:12px;color:#64748b;margin:6px 0 0}
.mbox textarea{width:100%;flex:1;min-height:320px;margin:12px 0;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#0f172a;color:#a5f3fc;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.45;resize:vertical}
.mbox .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:15px;pointer-events:none;text-align:center;padding:20px}
.empty[hidden]{display:none}
</style>
</head>
<body>
<header class="toolbar">
  <h1>🌳 База клиентов</h1>
  <span class="stat" id="stats"></span>
  <div class="spacer"></div>
  <div class="field">
    <span class="ico">🔍</span>
    <input id="q" type="search" placeholder="Поиск по клиентам, компаниям, факторам…" autocomplete="off">
  </div>
  <button id="expandAll" title="Показать все уровни">⤢ Развернуть всё</button>
  <button id="collapseAll" title="Свернуть до ролей">⤡ Свернуть всё</button>
  <button id="fbtn" title="Показать/скрыть факторы как отдельные узлы дерева">🧩 Факторы: выкл</button>
  <div class="zoom">
    <button id="zout" title="Уменьшить">−</button>
    <button id="zoomPc" class="pc" title="Сбросить масштаб">100%</button>
    <button id="zin" title="Увеличить">+</button>
  </div>
  <button class="primary" id="jsonBtn" title="Загрузить / скачать данные JSON">🗂 JSON</button>
</header>

<main class="viewport" id="viewport">
  <div class="zoomwrap" id="zoomwrap">
    <div class="canvas" id="canvas">
      <svg class="edges" id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="nodes" id="nodes"></div>
    </div>
  </div>
  <div class="empty" id="empty" hidden></div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="overlay" id="overlay" hidden></div>
<div class="modal" id="m">
  <div class="mbox">
    <b>🗂 Данные клиентов (JSON)</b>
    <p class="hint">Можно редактировать, добавлять или удалять записи прямо здесь и нажать «Сохранить». Данные хранятся в браузере (localStorage) и не пропадут при перезагрузке.</p>
    <textarea id="jin" spellcheck="false"></textarea>
    <div class="row">
      <button type="button" id="dlBtn">⬇ Скачать JSON</button>
      <button type="button" id="resetBtn">↺ Пример</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn">Отмена</button>
      <button type="button" class="primary" id="saveBtn">Сохранить и построить</button>
    </div>
  </div>
</div>

<script>
const def = [
  {
    "role": "ЛПР — Безопасники/ИТ",
    "companies": [
      {
        "company": "Ромашка (крупный ритейл)",
        "people": [
          {
            "fio": "Валерий Викторович Строганов",
            "position": "ИТ-директор (CIO)",
            "factors": [
              { "n": 1, "name": "Моральная составляющая", "text": "Консерватор. Скептически относится к модным трендам и ИИ. Не любит, когда ему «продают», ценит факты и сухие цифры. Общается жестко, может резко оборвать, если ему кажется, что менеджер не разбирается в технике." },
              { "n": 2, "name": "Кошелёк (Бюджет)", "text": "Предпочитает крупные, долгосрочные проекты. Бюджет выделяет неохотно, любит растягивать оплату по этапам. Часто берет «бюджетные» пилоты, чтобы проверить подрядчика." },
              { "n": 3, "name": "История взаимодействия", "text": "С нами работал 2 года назад, проект сдали с трудом (были баги). Сейчас взаимодействуем редко, мы предлагаем идеи и активно используем пиар-компанию, от него - нет ответа, игнор, переписка сугубо официальная." },
              { "n": 4, "name": "История посещений", "text": "Игнорирует массовые вебинары и конференции. Один раз посетил закрытый ужин для CIO. На мероприятия ходит только ради нетворкинга с топами, а не ради контента." },
              { "n": 5, "name": "Лояльность к нам", "text": "Низкая. Открыто доверяет нашему конкуренту (компании N). Любит докапываться до мелких недочетов в КП, часто вносит правки в договор." },
              { "n": 6, "name": "Вовлеченность в процесс", "text": "Высокая, но токсичная. Требует детального ТЗ на 50 листов. Не дает доступ к инфраструктуре, пока не подпишет NDA. Данные выдает скупо." },
              { "n": 7, "name": "Степень понимания", "text": "Очень высоко шарит в ИТ и безопасности. Понимает, чего хочет, но его требования иногда избыточны. Если мы предложим что-то некомпетентное — сразу это заметит." },
              { "n": 8, "name": "Дедлайны", "text": "Жесткие. Если сказал «внедрить до 1 декабря», то опоздание даже на день — повод для штрафов и разрыва контракта." },
              { "n": 9, "name": "Точка входа / Рычаг влияния", "text": "На него невозможно выйти напрямую через маркетинг. Лучший способ — зайти через его финансового директора (показать ROI) или через лояльного нам технического специалиста из его команды." }
            ]
          }
        ]
      }
    ]
  },
  {
    "role": "ЛДПР — Закупки материалов",
    "companies": [
      {
        "company": "Вектор-Строй (девелопмент и строительство)",
        "people": [
          {
            "fio": "Елена Сергеевна Ковалёва",
            "position": "Руководитель отдела закупок и снабжения",
            "factors": [
              { "n": 1, "name": "Моральная составляющая", "text": "Прагматик и перестраховщик. Главная цель — закрыть заявку вовремя и без проблем для себя. Не любит сложные технические термины, ей важна простота, надежность и понятные условия. Общается вежливо, но сухо и по делу, ценит свое время." },
              { "n": 2, "name": "Кошелёк (Бюджет)", "text": "Работает строго в рамках утвержденной сметы. Ищет минимальную цену на рынке и всегда просит скидку (минимум 10–15%). Обожает постоплату или отсрочку платежа на 30–60 дней." },
              { "n": 3, "name": "История взаимодействия", "text": "Новая компания, ранее не работали. Попала в нашу базу после холодного обзвона. На письма отвечает медленно, часто пересылает их своим подчиненным с пометкой «разобраться и доложить»." },
              { "n": 4, "name": "История посещений", "text": "Никуда не ходит, так как завалена рутиной и тендерами. Иногда смотрит короткие обзорные ролики по выбору поставщиков или читает отраслевые телеграм-каналы про логистику и цены на сырье." },
              { "n": 5, "name": "Лояльность к нам", "text": "Нейтрально-настороженная. У нее уже есть 2–3 «прикормленных» проверенных поставщика, с которыми она работает годами. Менять их ради нас она не хочет, чтобы не рисковать срывом поставок." },
              { "n": 6, "name": "Вовлеченность в процесс", "text": "Средняя, бюрократическая. Ей не интересны детали продукта, ее волнуют сертификаты, сроки отгрузки, наличие товара на складе и правильность закрывающих документов (УПД, счета-фактуры)." },
              { "n": 7, "name": "Степень понимания", "text": "Отлично разбирается в ценообразовании, логистике и тендерных процедурах. В технических характеристиках материалов разбирается поверхностно — ориентируется только на те параметры, которые ей спустили инженеры в заявке." },
              { "n": 8, "name": "Дедлайны", "text": "«Нужно было еще вчера». Заявки от строителей часто прилетают в последний момент, поэтому ей критически важна скорость выставления счета и быстрая доставка." },
              { "n": 9, "name": "Точка входа / Рычаг влияния", "text": "Прямые продажи «в лоб» не работают. Зайти можно через статус «запасного аэродрома» (когда основной поставщик подведет по срокам или цене), либо через главного инженера объекта, который сам укажет в заявке конкретно нашу марку материалов." }
            ]
          }
        ]
      }
    ]
  },
  {
    "role": "ЛВР — Юристы",
    "companies": [
      {
        "company": "Вектор-Строй (девелопмент и строительство)",
        "people": [
          {
            "fio": "Артём Олегович Светлов",
            "position": "Ведущий юрисконсульт",
            "factors": [
              { "n": 1, "name": "Моральная составляющая", "text": "Доброжелательный, открытый и легкий в общении человек. Старается не создавать конфликтов и всегда идет навстречу, если его вежливо попросить. Не любит бюрократические войны и искренне хочет, чтобы сделка прошла быстро и безболезненно для всех сторон." },
              { "n": 2, "name": "Кошелёк (Бюджет)", "text": "Сам бюджетом не распоряжается и в цифры особо не вникает. Смотрит только на то, чтобы в договоре не было очевидных кабальных штрафов для его компании, а общая сумма сходилась с заявкой." },
              { "n": 3, "name": "История взаимодействия", "text": "Работали с ним пару раз по мелким договорам. Всегда на связи в мессенджерах, отвечает быстро, с юмором и смайликами. Если в документах есть мелкие ошибки, не заворачивает их официально, а просто пишет в личку: «Поправьте вот тут по-братски, и я подпишу»." },
              { "n": 4, "name": "История посещений", "text": "Любит любые активности, где можно отвлечься от рутины. С удовольствием ходит на наши открытые вебинары, бизнес-завтраки и неформальные встречи, даже если тема не совсем юридическая — просто ради приятной атмосферы и общения." },
              { "n": 5, "name": "Лояльность к нам", "text": "Максимально высокая. Считает нас «своими ребятами» и надежными партнерами. Полностью доверяет нашим формулировкам в договоре и часто подписывает документы почти не глядя, полагаясь на наше честное слово." },
              { "n": 6, "name": "Вовлеченность в процесс", "text": "Низкая, формальная. Ему лень глубоко погружаться в суть проекта. Если мы сами подготовим шаблон договора, спецификацию и все приложения, он с радостью согласует их за полчаса, чтобы не делать лишнюю работу самому." },
              { "n": 7, "name": "Степень понимания", "text": "В стройке, материалах и технических деталях вообще не разбирается. Легко верит на слово нашим менеджерам, когда мы объясняем, зачем нужен тот или иной пункт в ТЗ или спецификации." },
              { "n": 8, "name": "Дедлайны", "text": "Очень гибкие и лояльные. Никогда не давит по срокам. Если мы не успеваем прислать документы или закрывающие акты вовремя, легко согласует перенос дат задним числом или подпишет допсоглашение без лишних вопросов." },
              { "n": 9, "name": "Точка входа / Рычаг влияния", "text": "Прямой контакт в мессенджере. Через него можно легко «протащить» выгодные для нас правки в договоре, обойти жесткие требования отдела закупок или заранее узнать, на каком этапе согласования застряли наши документы внутри компании." }
            ]
          }
        ]
      }
    ]
  }
];
/* ===== Состояние ===== */
const LS_KEY = 'treeDataV2';
let data;
try {
  const saved = localStorage.getItem(LS_KEY);
  data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(def));
} catch (e) {
  data = JSON.parse(JSON.stringify(def));
}
if (!Array.isArray(data)) data = JSON.parse(JSON.stringify(def));

const collapsed = new Set();
let showFactors = false;
let zoom = 1;
let canvasSize = { w: 380, h: 280 };
let nodeIndex = new Map();

const els = {
  viewport: document.getElementById('viewport'),
  zoomwrap: document.getElementById('zoomwrap'),
  canvas:   document.getElementById('canvas'),
  edges:    document.getElementById('edges'),
  nodes:    document.getElementById('nodes'),
  empty:    document.getElementById('empty'),
  q:        document.getElementById('q'),
  stats:    document.getElementById('stats'),
  zoomPc:   document.getElementById('zoomPc'),
  fbtn:     document.getElementById('fbtn'),
  drawer:   document.getElementById('drawer'),
  overlay:  document.getElementById('overlay')
};

/* Геометрия узлов и отступы */
const GEO = {
  root:    { w: 264, h: 78 },
  role:    { w: 252, h: 74 },
  company: { w: 264, h: 80 },
  person:  { w: 272, h: 98 },
  factor:  { w: 236, h: 56 }
};
const LEVELS = ['root', 'role', 'company', 'person', 'factor'];
const H_GAP = 30, V_GAP = 64, PAD = 48;

const EDGE_DEFS = '<defs><marker id="arw" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L4,6 Z" fill="#475569"></path></marker></defs>';

/* ===== Вспомогательные ===== */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
function hl(s, q) {
  s = String(s == null ? '' : s);
  if (!q) return esc(s);
  let rx;
  try { rx = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); }
  catch (e) { return esc(s); }
  return s.split(rx).map((part, i) => (i % 2 === 1) ? '<mark>' + esc(part) + '</mark>' : esc(part)).join('');
}

/* ===== Построение дерева из данных ===== */
function buildTree(query) {
  const q = (query || '').toLowerCase().trim();
  const root = { id: 'root', type: 'root', title: 'База клиентов', children: [] };
  (Array.isArray(data) ? data : []).forEach((rObj, ri) => {
    const roleName = (rObj && rObj.role) ? rObj.role : 'Без роли';
    const roleHit = !!q && roleName.toLowerCase().includes(q);
    const role = { id: 'r' + ri, type: 'role', title: roleName, hit: roleHit, children: [] };
    ((rObj && rObj.companies) || []).forEach((cObj, ci) => {
      const compName = (cObj && cObj.company) ? cObj.company : 'Без компании';
      const compHit = !!q && compName.toLowerCase().includes(q);
      const comp = { id: 'c' + ri + '_' + ci, type: 'company', title: compName, hit: compHit, children: [] };
      ((cObj && cObj.people) || []).forEach((p, pi) => {
        const blob = JSON.stringify(p || {}).toLowerCase();
        const personHit = !!q && blob.includes(q);
        if (q && !roleHit && !compHit && !personHit) return;
        const person = {
          id: 'p' + ri + '_' + ci + '_' + pi, type: 'person',
          title: (p && p.fio) ? p.fio : 'Без имени',
          subtitle: (p && p.position) ? p.position : '',
          role: roleName, company: compName, person: p, hit: personHit, children: []
        };
        if (showFactors) {
          person.children = ((p && p.factors) || []).map((f, fi) => ({
            id: 'f' + ri + '_' + ci + '_' + pi + '_' + fi, type: 'factor',
            title: (f && f.n ? f.n + '. ' : '') + ((f && f.name) || ''),
            person: p, factor: f, children: []
          }));
        }
        comp.children.push(person);
      });
      if (q && !roleHit && !compHit && comp.children.length === 0) return;
      role.children.push(comp);
    });
    if (q && !roleHit && role.children.length === 0) return;
    root.children.push(role);
  });
  return root;
}

function countPeople(node) {
  if (node.type === 'person') return 1;
  return (node.children || []).reduce((s, c) => s + countPeople(c), 0);
}
function countCompanies(node) {
  if (node.type === 'company') return 1;
  return (node.children || []).reduce((s, c) => s + countCompanies(c), 0);
}

/* ===== Компоновка (tidy-tree, сверху вниз) ===== */
function levelY(depth) {
  let y = PAD;
  for (let i = 0; i < depth; i++) y += GEO[LEVELS[i]].h + V_GAP;
  return y;
}
function measure(node) {
  const g = GEO[node.type];
  const kids = node.children || [];
  if (kids.length === 0) { node.subW = g.w; return; }
  let total = 0;
  kids.forEach((c, i) => { measure(c); total += c.subW + (i > 0 ? H_GAP : 0); });
  node.subW = Math.max(g.w, total);
}
function assign(node, left, depth) {
  const g = GEO[node.type];
  const kids = node.children || [];
  node.depth = depth; node.top = levelY(depth); node.w = g.w; node.h = g.h;
  if (kids.length === 0) { node.x = left + node.subW / 2; return; }
  let total = 0;
  kids.forEach((c, i) => { total += c.subW + (i > 0 ? H_GAP : 0); });
  let cursor = left + (node.subW - total) / 2;
  kids.forEach(c => { assign(c, cursor, depth + 1); cursor += c.subW + H_GAP; });
  node.x = (kids[0].x + kids[kids.length - 1].x) / 2;
}
function flatten(node, out) {
  out.push(node);
  (node.children || []).forEach(c => flatten(c, out));
  return out;
}
function pruneCollapsed(node) {
  if (collapsed.has(node.id)) { node.children = []; return; }
  (node.children || []).forEach(pruneCollapsed);
}
/* ===== Отрисовка карточек и связей ===== */
function cardHtml(n, q) {
  const style = 'left:' + (n.x - n.w / 2) + 'px;top:' + n.top + 'px;width:' + n.w + 'px;height:' + n.h + 'px';
  if (n.type === 'root') {
    return '<div class="card t-root" style="' + style + '">' +
      '<div class="ttl">' + hl(n.title, q) + '</div>' +
      '<div class="sub">' + esc(n.subtitle) + '</div></div>';
  }
  if (n.type === 'role' || n.type === 'company') {
    const coll = collapsed.has(n.id);
    return '<div class="card t-' + n.type + (coll ? ' collapsed' : '') + '" data-id="' + n.id + '" data-act="toggle" style="' + style + '">' +
      '<span class="caret">' + (coll ? '▶' : '▼') + '</span>' +
      '<div class="ttl">' + hl(n.title, q) + '</div>' +
      '<div class="sub">' + esc(n.subtitle) + '</div></div>';
  }
  if (n.type === 'person') {
    const fc = (n.person && n.person.factors) ? n.person.factors.length : 0;
    const sub = hl(n.subtitle, q) + (fc ? '<span class="fc"> · факторов: ' + fc + '</span>' : '');
    return '<div class="card t-person' + (n.hit ? ' hit' : '') + '" data-id="' + n.id + '" data-act="open" style="' + style + '">' +
      '<div class="ttl">' + hl(n.title, q) + '</div>' +
      '<div class="sub">' + sub + '</div></div>';
  }
  if (n.type === 'factor') {
    return '<div class="card t-factor" data-id="' + n.id + '" data-act="factor" style="' + style + '">' +
      '<div class="ttl">' + hl(n.title, q) + '</div></div>';
  }
  return '';
}

function applyZoom() {
  els.canvas.style.transform = 'scale(' + zoom + ')';
  els.zoomwrap.style.width = (canvasSize.w * zoom) + 'px';
  els.zoomwrap.style.height = (canvasSize.h * zoom) + 'px';
  els.zoomPc.textContent = Math.round(zoom * 100) + '%';
}

function render() {
  const q = els.q.value || '';
  const qq = q.toLowerCase().trim();
  const tree = buildTree(q);

  tree.subtitle = 'Роли: ' + tree.children.length + ' · Компаний: ' + countCompanies(tree) + ' · Клиентов: ' + countPeople(tree);
  (function walk(n) {
    if (n.type === 'role') n.subtitle = 'Компаний: ' + countCompanies(n) + ' · Клиентов: ' + countPeople(n);
    if (n.type === 'company') n.subtitle = 'Клиентов: ' + countPeople(n);
    (n.children || []).forEach(walk);
  })(tree);

  els.stats.textContent = countPeople(tree) + ' клиент(ов) · ' + countCompanies(tree) + ' компани(й)';

  if (!qq) pruneCollapsed(tree);

  measure(tree);
  assign(tree, PAD, 0);
  const all = flatten(tree, []);
  nodeIndex = new Map();
  all.forEach(n => nodeIndex.set(n.id, n));

  let maxX = 0, maxY = 0;
  all.forEach(n => { maxX = Math.max(maxX, n.x + n.w / 2); maxY = Math.max(maxY, n.top + n.h); });
  const W = Math.max(maxX + PAD, 380);
  const H = Math.max(maxY + PAD, 280);
  canvasSize = { w: W, h: H };

  let paths = '';
  all.forEach(n => {
    (n.children || []).forEach(ch => {
      const x1 = n.x, y1 = n.top + n.h, x2 = ch.x, y2 = ch.top;
      const my = y1 + (y2 - y1) / 2;
      paths += '<path marker-end="url(#arw)" d="M' + x1 + ',' + y1 + ' L' + x1 + ',' + my + ' L' + x2 + ',' + my + ' L' + x2 + ',' + y2 + '"></path>';
    });
  });
  els.edges.setAttribute('width', W);
  els.edges.setAttribute('height', H);
  els.edges.innerHTML = EDGE_DEFS + paths;

  let html = '';
  all.forEach(n => { html += cardHtml(n, qq); });
  els.nodes.innerHTML = html;

  els.canvas.style.width = W + 'px';
  els.canvas.style.height = H + 'px';
  applyZoom();

  const isEmpty = tree.children.length === 0;
  els.empty.hidden = !isEmpty;
  els.empty.textContent = isEmpty ? (qq ? 'Ничего не найдено по запросу «' + q.trim() + '»' : 'Нет данных') : '';
}
/* ===== Панель подробностей клиента ===== */
function openDrawer(p, personNode, factor) {
  p = p || {};
  const factors = p.factors || [];
  let body = '';
  if (factors.length) {
    factors.forEach(f => {
      const flash = factor && factor === f;
      body += '<div class="fitem' + (flash ? ' flash' : '') + '">' +
        '<div class="fn">' + esc((f.n ? f.n + '. ' : '') + (f.name || '')) + '</div>' +
        '<div class="ft">' + esc(f.text || '') + '</div></div>';
    });
  } else {
    body = '<div class="ft" style="color:#94a3b8">Факторы не заданы.</div>';
  }
  els.drawer.innerHTML =
    '<button class="dclose" id="dclose" title="Закрыть">✕</button>' +
    '<div class="dhead">' +
      '<div class="nm">👤 ' + esc(p.fio || 'Без имени') + '</div>' +
      (p.position ? '<div class="ps">' + esc(p.position) + '</div>' : '') +
      '<div class="chips">' +
        (personNode && personNode.role ? '<span class="chip role">' + esc(personNode.role) + '</span>' : '') +
        (personNode && personNode.company ? '<span class="chip company">🏢 ' + esc(personNode.company) + '</span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="dbody">' + body + '</div>';
  els.drawer.classList.add('show');
  els.overlay.hidden = false;
  const closeBtn = document.getElementById('dclose');
  if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
  if (factor) {
    const t = els.drawer.querySelector('.fitem.flash');
    if (t) t.scrollIntoView({ block: 'center' });
  }
}
function closeDrawer() { els.drawer.classList.remove('show'); els.overlay.hidden = true; }

/* ===== JSON-модалка ===== */
function openM() { document.getElementById('jin').value = JSON.stringify(data, null, 2); document.getElementById('m').classList.add('show'); }
function closeM() { document.getElementById('m').classList.remove('show'); }
function save() {
  try {
    const parsed = JSON.parse(document.getElementById('jin').value);
    if (!Array.isArray(parsed)) throw new Error('Ожидается массив объектов верхнего уровня');
    data = parsed;
    localStorage.setItem(LS_KEY, JSON.stringify(data));
    collapsed.clear(); showFactors = false; syncFbtn();
    closeM(); render();
  } catch (e) { alert('Ошибка JSON: ' + e.message); }
}
function downloadJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Клиенты_дерево.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
function resetDefault() {
  if (!confirm('Вернуть исходные данные из примера? Текущие изменения в браузере будут потеряны.')) return;
  data = JSON.parse(JSON.stringify(def));
  localStorage.removeItem(LS_KEY);
  collapsed.clear(); showFactors = false; syncFbtn();
  closeM(); render();
}
function syncFbtn() {
  els.fbtn.classList.toggle('active', showFactors);
  els.fbtn.textContent = showFactors ? '🧩 Факторы: вкл' : '🧩 Факторы: выкл';
}
function setZoom(z) { zoom = Math.min(2, Math.max(0.3, +z.toFixed(2))); applyZoom(); }

/* ===== События ===== */
els.nodes.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const act = card.dataset.act, id = card.dataset.id;
  if (act === 'toggle') {
    if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
    render();
    return;
  }
  const node = nodeIndex.get(id);
  if (!node) return;
  if (act === 'open') openDrawer(node.person, node, null);
  else if (act === 'factor') openDrawer(node.person, node, node.factor);
});

els.q.addEventListener('input', render);
document.getElementById('expandAll').addEventListener('click', () => { collapsed.clear(); render(); });
document.getElementById('collapseAll').addEventListener('click', () => {
  collapsed.clear();
  const arr = Array.isArray(data) ? data : [];
  for (let ri = 0; ri < arr.length; ri++) collapsed.add('r' + ri);
  render();
});
els.fbtn.addEventListener('click', () => { showFactors = !showFactors; syncFbtn(); render(); });
document.getElementById('zout').addEventListener('click', () => setZoom(zoom - 0.1));
document.getElementById('zin').addEventListener('click', () => setZoom(zoom + 0.1));
els.zoomPc.addEventListener('click', () => setZoom(1));
document.getElementById('jsonBtn').addEventListener('click', openM);
document.getElementById('cancelBtn').addEventListener('click', closeM);
document.getElementById('saveBtn').addEventListener('click', save);
document.getElementById('dlBtn').addEventListener('click', downloadJSON);
document.getElementById('resetBtn').addEventListener('click', resetDefault);
els.overlay.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); closeM(); } });
els.viewport.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setZoom(zoom + (e.deltaY < 0 ? 0.1 : -0.1));
}, { passive: false });

syncFbtn();
render();
</script>
